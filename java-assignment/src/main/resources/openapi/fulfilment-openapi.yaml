openapi: 3.0.0
info:
  title: Fulfilment API
  description: API for associating warehouses as fulfilment units of products to stores
  version: 1.0.0

paths:
  /fulfilment:
    get:
      summary: List the fulfilment associations
      operationId: listFulfilments
      parameters:
        - name: productId
          in: query
          required: false
          description: Only the associations of that product
          schema:
            type: integer
            format: int64
        - name: storeId
          in: query
          required: false
          description: Only the associations of that store
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The matching associations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fulfilment'
    post:
      summary: Associate a warehouse as a fulfilment unit
      description: |
        Registers a warehouse as a fulfilment unit of a product for a store. A product can be
        fulfilled by at most 2 warehouses per store, a store by at most 3 warehouses, and a
        warehouse can store at most 5 product types.
      operationId: createFulfilment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fulfilment'
      responses:
        '201':
          description: Association created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfilment'

        '400':
          description: Invalid request parameters, unknown reference or limit reached

  /fulfilment/{id}:
    delete:
      summary: Remove a fulfilment association by ID
      operationId: removeFulfilment
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the association to remove
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Association removed
        '404':
          description: Association not found

components:
  schemas:
    Fulfilment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12
        productId:
          type: integer
          format: int64
          example: 2
        storeId:
          type: integer
          format: int64
          example: 3
        warehouseBusinessUnitCode:
          type: string
          example: "MWH.001"
